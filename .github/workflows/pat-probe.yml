name: pat-probe
on:
  workflow_dispatch:
    inputs:
      token:
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CLI
        run: curl -fsSL https://qoder.com/install | bash
      - name: Try QODER_SDK_ACCESS_TOKEN
        env:
          QODER_SDK_ACCESS_TOKEN: ${{ inputs.token }}
        run: |
          timeout 120 qodercli -p -o json "Reply with exactly: sdk-ok" && echo "SDK_TOKEN_OK" || echo "SDK_TOKEN_FAIL=$?"
      - name: Try auth stdin
        run: |
          printf '{"schemaVersion":1,"type":"auth.init","authType":"accessToken","token":"%s"}' "${{ inputs.token }}" | \
            QODER_AUTH_STDIN=1 timeout 120 qodercli -p -o json "Reply with exactly: stdin-ok" && echo "STDIN_OK" || echo "STDIN_FAIL=$?"
